name: Build and Publish

# Builds the Astro site and publishes the static output to the `live` branch.
# cPanel's Git Version Control clones the `live` branch directly into public_html,
# so no build step (npm/node) is needed on the hosting server itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist/ to live branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: live
          # Keep linear history (no force_orphan) so cPanel's Git Version Control
          # can always fast-forward a plain `git pull` without conflicts.
          force_orphan: false
          keep_files: false
